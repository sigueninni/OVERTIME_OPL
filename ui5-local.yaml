specVersion: "4.0"
metadata:
  name: zovertime_process.sanofiovertmeprocess
type: application
framework:
  name: SAPUI5
  version: 1.120.20
  libraries:
    - name: sap.ui.core
    - name: sap.m
    - name: sap.f
    - name: sap.ui.comp
    - name: sap.ui.generic.app
    - name: sap.ui.table
    - name: sap.ushell
    - name: themelib_sap_bluecrystal
    - name: themelib_sap_fiori_3
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: true
        backend:
          - path: /sap
            url: https://vhng1ed5ci.pce.eu11.euhreka.com:44300/
            client: "386"
            destination: ED5
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: zovertime_process.SanofiOvertmeProcess
        ui5Theme: sap_fiori_3
